[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jwtpeek"
dynamic = ["version"]
description = "Decode and security-inspect JSON Web Tokens without verifying signatures."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sharique Ahmad" }]
keywords = ["jwt", "security", "pentest", "cli", "token"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Environment :: Console",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
jwtpeek = "jwtpeek.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "jwtpeek.__version__" }
